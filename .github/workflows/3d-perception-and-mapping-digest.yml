name: Publish weekly 3D perception and mapping digest

on:
  schedule:
    - cron: "0 9 * * FRI"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: 3d-perception-and-mapping-digest
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-digest.yml
    with:
      profile: 3d-perception-and-mapping
      review: true
      timeout-minutes: 15
      commit-prefix: Publish 3D perception and mapping digest
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
