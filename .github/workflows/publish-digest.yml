name: Publish a digest

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      review:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 10
      commit-prefix:
        type: string
        default: Publish digest
    secrets:
      GEMINI_API_KEY:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      DIGEST_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Check for today's edition
        id: edition
        run: |
          run_at=$(TZ=Europe/Zurich date +'%Y-%m-%dT%H:%M:%S%:z')
          day="${run_at%%T*}"
          post=$(python3 .github/digests/generate.py "$DIGEST_PROFILE" --run-at "$run_at" --post-path)
          {
            echo "day=$day"
            echo "post=$post"
            echo "run_at=$run_at"
          } >> "$GITHUB_OUTPUT"
          if [[ -f "$post" ]]; then
            echo "The edition is already on master."
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the digest
        id: generate
        if: steps.edition.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
          DIGEST_AUTHOR: ${{ vars.DIGEST_AUTHOR }}
          DIGEST_RUN_AT: ${{ steps.edition.outputs.run_at }}
          DIGEST_REVIEW: ${{ inputs.review }}
        run: |
          args=("$DIGEST_PROFILE" --run-at "$DIGEST_RUN_AT")
          if [[ "$DIGEST_REVIEW" == true ]]; then
            args+=(--review)
          fi
          python3 .github/digests/generate.py "${args[@]}"
      - name: Save review lessons and publish an approved digest
        if: ${{ !cancelled() && steps.edition.outputs.generate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_DAY: ${{ steps.edition.outputs.day }}
          DIGEST_POST: ${{ steps.edition.outputs.post }}
          DIGEST_COMMIT_PREFIX: ${{ inputs.commit-prefix }}
          DIGEST_RESULT: ${{ steps.generate.outcome }}
        run: |
          lessons=".github/digests/profiles/$DIGEST_PROFILE/learned-rules.json"
          if [[ -f "$lessons" ]]; then
            git add -- "$lessons"
          fi
          if [[ "$DIGEST_RESULT" == success ]]; then
            test -s "$DIGEST_POST"
            git add -- "$DIGEST_POST"
            message="$DIGEST_COMMIT_PREFIX for $DIGEST_DAY"
          else
            message="Save review lessons for $DIGEST_PROFILE"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          gh auth setup-git --hostname github.com
          # Digests scheduled together can advance master between the pull and push.
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
            echo "Digest push attempt $attempt failed." >&2
          done
          exit 1
      - name: Trigger the Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with GITHUB_TOKEN do not trigger other workflows.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
