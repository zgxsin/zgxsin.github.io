<figure id="rl-compounding-error" class="fig rlce">
  <div class="fig-legend">
    <span><i class="rlce-swatch" style="background: #f0fff4; border-color: #22863a"></i>states covered by the demonstrations</span>
    <span><i class="rlce-line" style="border-color: var(--fig-green)"></i>expert</span>
    <span><i class="rlce-line" style="border-color: var(--fig-red)"></i>behavior cloning</span>
    <span><i class="rlce-line" style="border-color: var(--fig-blue)"></i>DAgger</span>
  </div>
  <svg class="fig-svg fig-svg-wide rlce-svg" viewBox="0 0 760 300" role="img" aria-label="Lateral offset from the expert path over 80 time steps for three policies. The expert stays on the path. A behavior cloning policy makes a small error each step; while it stays inside the band of states seen in the demonstrations it corrects itself, but once the errors push it outside that band it has no idea how to recover and drifts off the road. A DAgger policy, trained on labels for the states it visits itself, keeps correcting and stays bounded. A slider sets the per-step imitation error."></svg>
  <label class="fig-control">Per-step imitation error &epsilon; <input type="range" id="rlce-eps" min="0" max="0.2" step="0.01" value="0.12"> <span id="rlce-eps-v"></span></label>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" | strip }}</figcaption>{% endif %}
</figure>
<style>
  .rlce-svg .rlce-note { font-size: 12px; fill: var(--fig-muted); }
  .rlce-swatch { display: inline-block; width: 12px; height: 10px; margin-right: 6px; border: 1px solid; }
  .rlce-line { display: inline-block; width: 18px; height: 0; border-top: 3px solid; margin-right: 6px; vertical-align: middle; }
  .rlce .fig-control span { color: var(--fig-text); }
</style>
<script>
(function () {
  var root = document.getElementById('rl-compounding-error');
  if (!root) return;
  var svg = root.querySelector('.rlce-svg');
  var epsIn = document.getElementById('rlce-eps');
  var NS = 'http://www.w3.org/2000/svg';
  var C = { text: '#24292e', muted: '#586069', border: '#d0d7de', blue: '#0366d6', green: '#22863a', greenBg: '#f0fff4', red: '#d73a49' };
  var T = 80, BAND = 0.5, GAIN = 0.3, ROAD = 2.5;
  var OX = 60, OY = 20, PW = 640, PH = 220, yMin = -0.5, yMax = 2.9;

  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  }
  function sx(t) { return OX + t / T * PW; }
  function sy(y) { return OY + (yMax - y) / (yMax - yMin) * PH; }
  // Fixed pseudo-random sequence so the plot does not flicker while dragging.
  function noise(t) { var x = Math.sin(t * 12.9898 + 3.1) * 43758.5453; return x - Math.floor(x); }

  // Each step adds an imitation error; the policy then applies its learned correction.
  // Behavior cloning only learned corrections inside the demonstrated band; DAgger learned them wherever it went.
  function rollout(eps, dagger) {
    var y = 0, pts = [[0, 0]];
    for (var t = 0; t < T; t++) {
      var corr = -GAIN * y;
      if (!dagger) {
        var out = Math.max(0, Math.abs(y) - BAND);
        corr *= Math.exp(-out * out / 0.01);
      }
      y = y + eps * 2 * noise(t) + corr;
      if (y >= ROAD) { pts.push([t + 1, ROAD]); return { pts: pts, crash: t + 1 }; }
      pts.push([t + 1, y]);
    }
    return { pts: pts, crash: null };
  }
  function line(pts, color) {
    el('polyline', { points: pts.map(function (p) { return sx(p[0]) + ',' + sy(p[1]); }).join(' '), fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linejoin': 'round' });
  }

  function draw() {
    var eps = Number(epsIn.value);
    document.getElementById('rlce-eps-v').textContent = eps.toFixed(2);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    el('rect', { x: OX, y: sy(BAND), width: PW, height: sy(-BAND) - sy(BAND), fill: C.greenBg });
    el('rect', { x: OX, y: OY, width: PW, height: PH, fill: 'none', stroke: C.border });
    el('line', { x1: OX, y1: sy(ROAD), x2: OX + PW, y2: sy(ROAD), stroke: C.red, 'stroke-dasharray': '5 4' });
    el('text', { x: OX + PW - 6, y: sy(ROAD) - 6, 'text-anchor': 'end', class: 'rlce-note' }, 'edge of the road: failure');
    el('text', { x: OX + PW - 6, y: sy(-BAND) - 6, 'text-anchor': 'end', class: 'rlce-note' }, 'demonstrated states');
    [0, 1, 2].forEach(function (v) {
      el('text', { x: OX - 8, y: sy(v) + 4, 'text-anchor': 'end', class: 'rlce-note' }, v.toString());
    });
    [0, 20, 40, 60, 80].forEach(function (t) {
      el('text', { x: sx(t), y: OY + PH + 16, 'text-anchor': 'middle', class: 'rlce-note' }, t.toString());
    });
    el('text', { x: OX + PW / 2, y: OY + PH + 34, 'text-anchor': 'middle', class: 'rlce-note' }, 'time step');
    el('text', { x: 16, y: OY + PH / 2, 'text-anchor': 'middle', class: 'rlce-note', transform: 'rotate(-90 16 ' + (OY + PH / 2) + ')' }, 'offset from expert path');

    line([[0, 0], [T, 0]], C.green);
    var dag = rollout(eps, true), bc = rollout(eps, false);
    line(dag.pts, C.blue);
    line(bc.pts, C.red);

    var msg = bc.crash
      ? 'Behavior cloning leaves the demonstrated states and fails at step ' + bc.crash + '. DAgger stays on the road.'
      : 'Both stay on the road: errors are small enough that behavior cloning never leaves the demonstrated states.';
    el('text', { x: OX + PW / 2, y: OY + PH + 56, 'text-anchor': 'middle' }, msg);
  }

  epsIn.addEventListener('input', draw);
  draw();
})();
</script>
