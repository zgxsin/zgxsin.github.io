collections:
  my_media:
    output: true

# https://stackoverflow.com/questions/16422933/how-do-i-use-markdownify-in-jekyll-to-show-an-excerpt-on-the-index
excerpt_separator: <!--more--> # You can also specify a different one. Please add a blank line above and one below when using it.

layout: stacked
style: light

# Jekyll 3 now only supports Kramdown for Markdown
kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: "highlight"

plugins:
  - jekyll-octicons
  - jekyll-github-metadata
  - jemoji
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# The site is built by .github/workflows/pages.yml with the Gemfile, so every plugin
# here runs both locally and live. jekyll-spaceship's mathjax and table processors stay
# off: they rewrite math and any line containing "|" before kramdown. MathJax and
# Mermaid are rendered client-side in _layouts/post.html.
jekyll-spaceship:
  processors:
    - plantuml-processor
    - polyfill-processor
    - media-processor
    - emoji-processor
    - element-processor

# Used by jekyll-github-metadata (site.github); CI has no git remote to infer it from.
repository: zgxsin/zgxsin.github.io

permalink: /:year/:month/:day/:title/

exclude:
  - README.md
  - CLAUDE.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

projects:
  sort_by: pushed
  # sort_by options:
  #   - pushed
  #   - stars
  limit: 3
  exclude:
    archived: false
    forks: true
    projects:
    # - repo-name

