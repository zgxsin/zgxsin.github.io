name: Publish daily robotics digest

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robotics-digest
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Check for today's edition
        id: edition
        run: |
          day=$(TZ=Europe/Zurich date +%F)
          post="_posts/$day-robotics-hardware-and-sensors-digest.md"
          {
            echo "day=$day"
            echo "post=$post"
          } >> "$GITHUB_OUTPUT"
          if [[ -f "$post" ]]; then
            echo "The edition is already on master."
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the digest
        if: steps.edition.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_DAY: ${{ steps.edition.outputs.day }}
        run: python3 .github/robotics-digest/generate.py --date "$DIGEST_DAY"
      - name: Push the digest to master
        if: steps.edition.outputs.generate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_DAY: ${{ steps.edition.outputs.day }}
          DIGEST_POST: ${{ steps.edition.outputs.post }}
        run: |
          test -s "$DIGEST_POST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIGEST_POST"
          git commit -m "Publish robotics digest for $DIGEST_DAY"
          gh auth setup-git --hostname github.com
          git push origin HEAD:refs/heads/master
      - name: Trigger the Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with GITHUB_TOKEN do not trigger other workflows.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
