<figure id="self-attention-sentence" class="fig atn">
  <div class="fig-buttons atn-ends">
    <button type="button" data-e="heavy" aria-pressed="true">... it was heavy</button>
    <button type="button" data-e="tired" aria-pressed="false">... it was tired</button>
  </div>
  <svg class="fig-svg fig-svg-wide atn-svg" viewBox="0 0 760 275" role="img" aria-label="The sentence 'The robot dropped the box because it was heavy' written twice, once as queries on top and once as keys below. Lines from the selected query word to every key word have a thickness proportional to its attention weight. For 'it', most weight goes to 'box' when the last word is heavy, and to 'robot' when it is tired."></svg>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" | strip }}</figcaption>{% endif %}
</figure>
<style>
  .atn-svg .atn-note { font-size: 12px; fill: var(--fig-muted); }
  .atn-svg .atn-word { cursor: pointer; }
  .atn-svg .atn-sel { font-weight: 700; fill: var(--fig-orange); }
</style>
<script>
(function () {
  var root = document.getElementById('self-attention-sentence');
  if (!root) return;
  var svg = root.querySelector('.atn-svg');
  var buttons = root.querySelectorAll('.atn-ends button');
  var NS = 'http://www.w3.org/2000/svg';
  var C = { text: '#24292e', muted: '#586069', border: '#d0d7de', blue: '#0366d6', orange: '#e36209', bg: '#f1f8ff' };
  var END = 'heavy', query = 6;

  function words() { return ['The', 'robot', 'dropped', 'the', 'box', 'because', 'it', 'was', END]; }

  // Hand-set relevance scores (not from a trained model): each word attends to itself and
  // its neighbours a little, plus a few grammatical or semantic links.
  function scores(q) {
    var s = [], w = words();
    for (var k = 0; k < w.length; k++) s.push(k === q ? 2 : (Math.abs(k - q) === 1 ? 1 : 0.3));
    var links = {
      0: { 1: 4 }, 1: { 2: 3, 0: 1 }, 2: { 1: 4, 4: 4 }, 3: { 4: 4 }, 4: { 2: 3, 3: 1.5 },
      5: { 2: 2, 8: 2 }, 7: { 6: 3, 8: 3 }
    };
    links[6] = END === 'heavy' ? { 4: 9, 8: 2, 1: 1 } : { 1: 9, 8: 2, 4: 1 };
    links[8] = END === 'heavy' ? { 4: 5, 6: 3 } : { 1: 5, 6: 3 };
    var extra = links[q] || {};
    for (var key in extra) s[key] += extra[key];
    var sum = s.reduce(function (a, b) { return a + b; }, 0);
    return s.map(function (v) { return v / sum; });
  }

  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  }

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var w = words(), a = scores(query);
    var X0 = 52, DX = 82, YQ = 40, YK = 150, YB = 245;
    function x(i) { return X0 + i * DX; }

    el('text', { x: 4, y: YQ - 22, class: 'atn-note' }, 'Query (click a word):');
    el('text', { x: 4, y: YB + 22, class: 'atn-note' }, 'Attention weights of the selected word over all words (they sum to 100%):');

    for (var k = 0; k < w.length; k++) {
      el('line', { x1: x(query), y1: YQ + 8, x2: x(k), y2: YK - 18, stroke: C.blue,
        'stroke-width': Math.max(0.5, 22 * a[k]), 'stroke-opacity': 0.25 + 0.75 * Math.min(1, a[k] * 2.5), 'stroke-linecap': 'round' });
    }
    for (k = 0; k < w.length; k++) {
      el('text', { x: x(k), y: YQ, 'text-anchor': 'middle', class: 'atn-word' + (k === query ? ' atn-sel' : ''), 'data-i': k }, w[k]);
      // Larger hit target behind the word.
      el('rect', { x: x(k) - 36, y: YQ - 18, width: 72, height: 26, fill: 'transparent', class: 'atn-word', 'data-i': k });
      el('text', { x: x(k), y: YK, 'text-anchor': 'middle', style: 'font-weight:' + (a[k] > 0.25 ? 700 : 400) }, w[k]);
      var h = Math.min(60, 60 * a[k] / 0.7);
      el('rect', { x: x(k) - 14, y: YB - h, width: 28, height: Math.max(1, h), fill: C.blue, 'fill-opacity': 0.8 });
      el('line', { x1: x(k) - 20, y1: YB, x2: x(k) + 20, y2: YB, stroke: C.border });
      el('text', { x: x(k), y: YB - h - 5, 'text-anchor': 'middle', class: 'atn-note' }, Math.round(100 * a[k]) + '%');
    }
  }

  svg.addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-i');
    if (i !== null && i !== undefined) { query = parseInt(i, 10); draw(); }
  });
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      END = b.getAttribute('data-e');
      buttons.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      draw();
    });
  });
  draw();
})();
</script>
