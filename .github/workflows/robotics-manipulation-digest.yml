name: Publish weekly robotics manipulation digest

on:
  schedule:
    - cron: "0 9 * * SUN"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robotics-manipulation-digest
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-digest.yml
    with:
      profile: robotics-manipulation
      review: true
      timeout-minutes: 15
      commit-prefix: Publish robotics manipulation digest
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
