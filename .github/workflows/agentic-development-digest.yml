name: Publish weekly agentic development digest

on:
  schedule:
    - cron: "0 9 * * WED"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agentic-development-digest
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-digest.yml
    with:
      profile: agentic-development
      review: true
      timeout-minutes: 15
      commit-prefix: Publish agentic development digest
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
