<figure id="lidar-tracking-loop" class="fig ltl">
  <svg class="fig-svg fig-svg-wide ltl-svg" viewBox="0 0 760 330" role="img" aria-label="One tracking cycle. Detections at time t and the existing tracks predicted to t are gated by Mahalanobis distance and associated with the Hungarian algorithm. Matched tracks get a Kalman update, unmatched detections start tentative tracks, unmatched tracks coast or are deleted. The track list is published to the planner and predicted again at the next scan.">
    <defs>
      <marker id="ltl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#24292e"></path>
      </marker>
      <marker id="ltl-arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#586069"></path>
      </marker>
    </defs>
<rect x="330" y="16" width="140" height="50" rx="8" fill="#f6f8fa" stroke="#959da5" stroke-width="1.3"></rect>
<text x="400.0" y="37.0" class="ltl-t">Detections at t</text>
<text x="400.0" y="54.0" class="ltl-s">boxes, centroids</text>
<rect x="20" y="120" width="140" height="60" rx="8" fill="#ffffff" stroke="#24292e" stroke-width="1.3"></rect>
<text x="90.0" y="146.0" class="ltl-t">Predict tracks</text>
<text x="90.0" y="163.0" class="ltl-s">to time t, CV / CTRV</text>
<rect x="185" y="120" width="120" height="60" rx="8" fill="#ffffff" stroke="#24292e" stroke-width="1.3"></rect>
<text x="245.0" y="146.0" class="ltl-t">Gate</text>
<text x="245.0" y="163.0" class="ltl-s">Mahalanobis, chi2</text>
<rect x="330" y="120" width="140" height="60" rx="8" fill="#ffffff" stroke="#24292e" stroke-width="1.3"></rect>
<text x="400.0" y="146.0" class="ltl-t">Associate</text>
<text x="400.0" y="163.0" class="ltl-s">Hungarian / GNN</text>
<rect x="505" y="30" width="135" height="54" rx="8" fill="#f1f8ff" stroke="#0366d6" stroke-width="1.3"></rect>
<text x="572.5" y="53.0" class="ltl-t">Matched</text>
<text x="572.5" y="70.0" class="ltl-s">Kalman update</text>
<rect x="505" y="123" width="135" height="54" rx="8" fill="#f1f8ff" stroke="#0366d6" stroke-width="1.3"></rect>
<text x="572.5" y="146.0" class="ltl-t">Unmatched dets</text>
<text x="572.5" y="163.0" class="ltl-s">new tentative tracks</text>
<rect x="505" y="216" width="135" height="54" rx="8" fill="#f1f8ff" stroke="#0366d6" stroke-width="1.3"></rect>
<text x="572.5" y="239.0" class="ltl-t">Unmatched tracks</text>
<text x="572.5" y="256.0" class="ltl-s">coast, then delete</text>
<rect x="665" y="30" width="80" height="240" rx="8" fill="#f0fff4" stroke="#22863a" stroke-width="1.3"></rect>
<text x="705.0" y="153.5" class="ltl-t">Track list</text>
<polyline points="400.0,66.0 400.0,120.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="160.0,150.0 185.0,150.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="305.0,150.0 330.0,150.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="470.0,150.0 505.0,57.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="640.0,57.0 665.0,57.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="470.0,150.0 505.0,150.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="640.0,150.0 665.0,150.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="470.0,150.0 505.0,243.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="640.0,243.0 665.0,243.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<polyline points="705.0,270.0 705.0,305.0 90.0,305.0 90.0,180.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<text x="400" y="300" text-anchor="middle" class="ltl-g">next scan</text>
<polyline points="705.0,30.0 705.0,8.0" fill="none" class="ltl-l" stroke="#24292e" marker-end="url(#ltl-arrow)"></polyline>
<text x="697" y="14" text-anchor="end" class="ltl-g">to planner: pose, velocity, covariance, class, ID</text>
  </svg>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" | strip }}</figcaption>{% endif %}
</figure>
<style>
  .ltl-svg .ltl-t { font-weight: 600; text-anchor: middle; }
  .ltl-svg .ltl-s { font-size: 12px; fill: var(--fig-muted); text-anchor: middle; }
  .ltl-svg .ltl-g { font-size: 12px; fill: var(--fig-muted); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .ltl-svg .ltl-zone { font-size: 12px; font-weight: 600; fill: var(--fig-muted); }
  .ltl-l { stroke-width: 1.4; }
  .ltl-d { stroke-dasharray: 5 4; }
</style>
