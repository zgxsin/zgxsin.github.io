<figure id="essential-four-solutions" class="efs">
  <div class="efs-legend">
    <span><i class="efs-swatch efs-blue"></i>camera 1</span>
    <span><i class="efs-swatch efs-purple"></i>camera 2</span>
    <span>solid ray: point in front of the camera, dashed ray: point behind it</span>
  </div>
  <svg class="efs-svg" role="img" aria-label="Top-down view of the four camera configurations that one essential matrix allows. Only one of them puts the triangulated point in front of both cameras."></svg>
</figure>
<style>
  .efs { margin: 1.5rem 0; }
  .efs-svg { width: 100%; display: block; overflow: visible; }
  .efs-svg text { font-size: 13px; fill: #24292e; }
  .efs-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.875rem; color: #586069; margin-bottom: 4px; }
  .efs-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .efs-blue { background: #0366d6; }
  .efs-purple { background: #6f42c1; }
</style>
<script>
(function () {
  var root = document.getElementById('essential-four-solutions');
  var svg = root.querySelector('.efs-svg');
  var NS = 'http://www.w3.org/2000/svg';
  var COLOR = { text: '#24292e', muted: '#586069', border: '#d0d7de', blue: '#0366d6', purple: '#6f42c1', green: '#28a745', red: '#d73a49' };

  // Top-down view (x to the right, z = forward). Camera 1 sits at the origin and looks along +z.
  var C2 = [1, 0], X = [0.2, 1.6], yaw = 15 * Math.PI / 180;
  var axis2 = [-Math.sin(yaw), Math.cos(yaw)];
  var ray1 = X, ray2 = [X[0] - C2[0], X[1] - C2[1]];
  // A rotation of pi about the baseline (the x axis here) mirrors in-plane directions across it.
  function twist(v) { return [v[0], -v[1]]; }

  var SOLUTIONS = [
    { title: '(R, t)', c: C2, axis: axis2, ray: ray2 },
    { title: '(R, −t)', c: [-C2[0], -C2[1]], axis: axis2, ray: ray2 },
    { title: '(R′, t)', c: C2, axis: twist(axis2), ray: twist(ray2) },
    { title: '(R′, −t)', c: [-C2[0], -C2[1]], axis: twist(axis2), ray: twist(ray2) }
  ];

  // Solve lambda1 * ray1 = c + lambda2 * ray for the triangulated point.
  function triangulate(s) {
    var det = ray1[0] * -s.ray[1] + s.ray[0] * ray1[1];
    var l1 = (s.c[0] * -s.ray[1] + s.ray[0] * s.c[1]) / det;
    var l2 = (ray1[0] * s.c[1] - ray1[1] * s.c[0]) / det;
    return { p: [l1 * ray1[0], l1 * ray1[1]], front1: l1 > 0, front2: l2 > 0 };
  }

  function el(name, attrs, text) {
    var node = document.createElementNS(NS, name);
    for (var key in attrs) node.setAttribute(key, attrs[key]);
    if (text !== undefined) node.textContent = text;
    svg.appendChild(node);
    return node;
  }

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var W = Math.max(300, svg.getBoundingClientRect().width || 728);
    var cols = W >= 560 ? 4 : 2, rows = 4 / cols;
    var gap = 12, pw = (W - gap * (cols - 1)) / cols;
    var xr = [-1.5, 1.5], zr = [-3.0, 3.0];
    var k = (pw - 16) / (xr[1] - xr[0]);
    var ph = k * (zr[1] - zr[0]) + 62;
    var H = rows * ph + (rows - 1) * gap;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    SOLUTIONS.forEach(function (s, i) {
      var ox = (i % cols) * (pw + gap), oy = Math.floor(i / cols) * (ph + gap);
      function pt(p) { return [ox + 8 + k * (p[0] - xr[0]), oy + 24 + k * (zr[1] - p[1])]; }
      function line(a, b, color, width, dash) {
        var p = pt(a), q = pt(b);
        var attrs = { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: color, 'stroke-width': width };
        if (dash) attrs['stroke-dasharray'] = dash;
        el('line', attrs);
      }
      function cameraIcon(c, axis, color) {
        var L = 0.32, a = Math.atan2(axis[1], axis[0]), h = 0.45;
        var p1 = [c[0] + L * Math.cos(a - h), c[1] + L * Math.sin(a - h)];
        var p2 = [c[0] + L * Math.cos(a + h), c[1] + L * Math.sin(a + h)];
        el('polygon', { points: [c, p1, p2].map(function (p) { return pt(p).join(','); }).join(' '), fill: color, 'fill-opacity': 0.25, stroke: color, 'stroke-width': 1.5 });
        var q = pt(c);
        el('circle', { cx: q[0], cy: q[1], r: 3, fill: color });
      }

      var res = triangulate(s);
      var ok = res.front1 && res.front2;
      el('rect', { x: ox, y: oy, width: pw, height: ph, rx: 4, fill: ok ? '#f0fff4' : '#fff', stroke: ok ? COLOR.green : COLOR.border, 'stroke-width': ok ? 1.5 : 1 });
      el('text', { x: ox + pw / 2, y: oy + 17, 'text-anchor': 'middle', 'font-weight': 600 }, s.title);
      line([xr[0], 0], [xr[1], 0], COLOR.border, 1, '3 3');

      line([0, 0], res.p, COLOR.blue, 1.5, res.front1 ? null : '4 3');
      line(s.c, res.p, COLOR.purple, 1.5, res.front2 ? null : '4 3');
      cameraIcon([0, 0], [0, 1], COLOR.blue);
      cameraIcon(s.c, s.axis, COLOR.purple);

      var q = pt(res.p);
      el('circle', { cx: q[0], cy: q[1], r: 4.5, fill: ok ? COLOR.green : '#fff', stroke: ok ? COLOR.green : COLOR.red, 'stroke-width': 1.5 });
      el('text', { x: q[0] + 8, y: q[1] + 4 }, 'X');

      var verdict = ok ? 'in front of both ✓' : !res.front1 && !res.front2 ? 'behind both' : !res.front1 ? 'behind camera 1' : 'behind camera 2';
      var node = el('text', { x: ox + pw / 2, y: oy + ph - 10, 'text-anchor': 'middle' }, verdict);
      node.style.fill = ok ? COLOR.green : COLOR.red;
    });
  }

  if (window.ResizeObserver) new ResizeObserver(draw).observe(svg);
  draw();
})();
</script>
