<figure id="gaussian-covariance" class="fig gcv">
  <div class="fig-legend gcv-legend">
    <span><i class="gcv-swatch gcv-red"></i>first axis, length s<sub>1</sub></span>
    <span><i class="gcv-swatch gcv-green"></i>second axis, length s<sub>2</sub></span>
    <span>dashed: one-sigma ellipse</span>
  </div>
  <div class="gcv-body">
    <svg class="fig-svg gcv-svg" viewBox="0 0 300 300" role="img" aria-label="A 2D Gaussian drawn as a blurred ellipse. Its two axes are set by a rotation angle and two scales, and the resulting covariance matrix is shown next to it."></svg>
    <div class="gcv-math"></div>
  </div>
  <label class="fig-control gcv-control"><span>Scale s<sub>1</sub>:</span><output class="gcv-s1-out"></output><input class="gcv-s1" type="range" min="0.15" max="1.6" step="0.01" value="1.2"></label>
  <label class="fig-control gcv-control"><span>Scale s<sub>2</sub>:</span><output class="gcv-s2-out"></output><input class="gcv-s2" type="range" min="0.15" max="1.6" step="0.01" value="0.4"></label>
  <label class="fig-control gcv-control"><span>Rotation θ:</span><output class="gcv-th-out"></output><input class="gcv-th" type="range" min="0" max="180" step="1" value="30"></label>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" | strip }}</figcaption>{% endif %}
</figure>
<style>
  .gcv-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .gcv-red { background: #d73a49; }
  .gcv-green { background: #28a745; }
  .gcv-body { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
  .gcv-svg { width: 100%; max-width: 300px; display: block; }
  .gcv-math { font-size: 0.9375rem; color: #24292e; font-variant-numeric: tabular-nums; line-height: 1.4; }
  .gcv-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .gcv-mat { display: inline-grid; grid-template-columns: auto auto; gap: 0 14px; padding: 2px 8px; border-left: 1.5px solid #24292e; border-right: 1.5px solid #24292e; border-radius: 4px; text-align: right; }
  .gcv-note { font-size: 0.875rem; color: #586069; max-width: 360px; }
  .gcv-control output { margin-left: 4px; color: #24292e; font-variant-numeric: tabular-nums; }
  .gcv-control input { display: block; width: 100%; margin-top: 6px; }
</style>
<script>
(function () {
  var root = document.getElementById('gaussian-covariance');
  var svg = root.querySelector('.gcv-svg');
  var math = root.querySelector('.gcv-math');
  var inputs = { s1: root.querySelector('.gcv-s1'), s2: root.querySelector('.gcv-s2'), th: root.querySelector('.gcv-th') };
  var NS = 'http://www.w3.org/2000/svg';
  var COLOR = { text: '#24292e', muted: '#586069', border: '#d0d7de', blue: '#0366d6', red: '#d73a49', green: '#28a745' };
  var C = 150, K = 300 / 6.4;

  function el(name, attrs, text, parent) {
    var node = document.createElementNS(NS, name);
    for (var key in attrs) node.setAttribute(key, attrs[key]);
    if (text !== undefined && text !== null) node.textContent = text;
    (parent || svg).appendChild(node);
    return node;
  }
  function mat(rows) {
    return '<span class="gcv-mat">' + rows.map(function (r) { return r.map(function (v) { return '<span>' + v.toFixed(2) + '</span>'; }).join(''); }).join('') + '</span>';
  }

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var s1 = parseFloat(inputs.s1.value), s2 = parseFloat(inputs.s2.value), th = parseFloat(inputs.th.value);
    var c = Math.cos(th * Math.PI / 180), s = Math.sin(th * Math.PI / 180);

    var defs = el('defs', {});
    var grad = el('radialGradient', { id: 'gcv-grad' }, null, defs);
    for (var r = 0; r <= 1.0001; r += 0.0625) {
      el('stop', { offset: r, 'stop-color': COLOR.blue, 'stop-opacity': (0.85 * Math.exp(-0.5 * Math.pow(3 * r, 2))).toFixed(3) }, null, grad);
    }

    el('line', { x1: 0, y1: C, x2: 300, y2: C, stroke: COLOR.border });
    el('line', { x1: C, y1: 0, x2: C, y2: 300, stroke: COLOR.border });
    var rot = 'rotate(' + (-th) + ' ' + C + ' ' + C + ')';
    el('ellipse', { cx: C, cy: C, rx: 3 * s1 * K, ry: 3 * s2 * K, fill: 'url(#gcv-grad)', transform: rot });
    el('ellipse', { cx: C, cy: C, rx: s1 * K, ry: s2 * K, fill: 'none', stroke: COLOR.text, 'stroke-dasharray': '4 3', transform: rot });

    function axis(v, len, color, label) {
      var x = C + v[0] * len * K, y = C - v[1] * len * K;
      el('line', { x1: C, y1: C, x2: x, y2: y, stroke: color, 'stroke-width': 2.5 });
      el('circle', { cx: x, cy: y, r: 3.5, fill: color });
      var lx = C + v[0] * (len * K + 16), ly = C - v[1] * (len * K + 16) + 4;
      el('text', { x: lx, y: ly, 'text-anchor': 'middle', fill: color, 'font-weight': 600 }, label);
    }
    axis([c, s], s1, COLOR.red, 's₁');
    axis([-s, c], s2, COLOR.green, 's₂');
    el('circle', { cx: C, cy: C, r: 3, fill: COLOR.text });
    el('text', { x: C + 6, y: C + 16, fill: COLOR.muted }, 'μ');

    var a = c * c * s1 * s1 + s * s * s2 * s2, b = c * s * (s1 * s1 - s2 * s2), d = s * s * s1 * s1 + c * c * s2 * s2;
    math.innerHTML =
      '<div class="gcv-row"><span>R =</span>' + mat([[c, -s], [s, c]]) + '<span>&nbsp;S =</span>' + mat([[s1, 0], [0, s2]]) + '</div>' +
      '<div class="gcv-row"><span>Σ = R S S<sup>T</sup> R<sup>T</sup> =</span>' + mat([[a, b], [b, d]]) + '</div>' +
      '<div class="gcv-note">Whatever the sliders say, Σ stays symmetric with eigenvalues s<sub>1</sub><sup>2</sup> and s<sub>2</sub><sup>2</sup>, so it is always a valid covariance. In 3D, R comes from a unit quaternion and S from three scales.</div>';
    root.querySelector('.gcv-s1-out').textContent = s1.toFixed(2);
    root.querySelector('.gcv-s2-out').textContent = s2.toFixed(2);
    root.querySelector('.gcv-th-out').textContent = th.toFixed(0) + '°';
  }

  for (var key in inputs) inputs[key].addEventListener('input', draw);
  draw();
})();
</script>
