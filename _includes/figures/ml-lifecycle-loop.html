<figure id="ml-lifecycle-loop" class="mll">
  <svg class="mll-svg" viewBox="0 0 760 330" role="img" aria-label="The machine learning lifecycle for a robot perception model, drawn as a loop. Offline on the workstation and cluster: define the task, collect data, label, train, evaluate. Then optimize and export, integrate into ROS 2, validate on the robot, deploy to the fleet, monitor. Monitoring feeds hard examples back to data collection.">
    <defs>
      <marker id="mll-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#24292e"></path>
      </marker>
      <marker id="mll-arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#22863a"></path>
      </marker>
    </defs>

    <rect x="10" y="30" width="740" height="110" rx="10" class="mll-zone-off"></rect>
    <text x="22" y="22" class="mll-zone-label">Offline: workstation and training cluster</text>
    <rect x="10" y="190" width="740" height="110" rx="10" class="mll-zone-on"></rect>
    <text x="22" y="322" class="mll-zone-label">On the robot and the fleet</text>

    <g class="mll-node">
      <rect x="30" y="60" width="118" height="50" rx="8"></rect>
      <text x="89" y="81">1. Define</text><text x="89" y="98" class="mll-sub">classes, latency, HW</text>
    </g>
    <g class="mll-node">
      <rect x="172" y="60" width="118" height="50" rx="8"></rect>
      <text x="231" y="81">2. Collect</text><text x="231" y="98" class="mll-sub">rosbags, synthetic</text>
    </g>
    <g class="mll-node">
      <rect x="314" y="60" width="118" height="50" rx="8"></rect>
      <text x="373" y="81">3. Label</text><text x="373" y="98" class="mll-sub">boxes, QA, version</text>
    </g>
    <g class="mll-node">
      <rect x="456" y="60" width="118" height="50" rx="8"></rect>
      <text x="515" y="81">4. Train</text><text x="515" y="98" class="mll-sub">fine-tune, track</text>
    </g>
    <g class="mll-node">
      <rect x="598" y="60" width="128" height="50" rx="8"></rect>
      <text x="662" y="81">5. Evaluate</text><text x="662" y="98" class="mll-sub">mAP, slices</text>
    </g>

    <g class="mll-node">
      <rect x="598" y="220" width="128" height="50" rx="8"></rect>
      <text x="662" y="241">6. Optimize</text><text x="662" y="258" class="mll-sub">ONNX, TensorRT</text>
    </g>
    <g class="mll-node">
      <rect x="456" y="220" width="118" height="50" rx="8"></rect>
      <text x="515" y="241">7. Integrate</text><text x="515" y="258" class="mll-sub">ROS 2 nodes</text>
    </g>
    <g class="mll-node">
      <rect x="314" y="220" width="118" height="50" rx="8"></rect>
      <text x="373" y="241">8. Validate</text><text x="373" y="258" class="mll-sub">replay, latency</text>
    </g>
    <g class="mll-node">
      <rect x="172" y="220" width="118" height="50" rx="8"></rect>
      <text x="231" y="241">9. Deploy</text><text x="231" y="258" class="mll-sub">shadow, canary</text>
    </g>
    <g class="mll-node mll-hot">
      <rect x="30" y="220" width="118" height="50" rx="8"></rect>
      <text x="89" y="241">10. Monitor</text><text x="89" y="258" class="mll-sub">drift, failures</text>
    </g>

    <g stroke="#24292e" stroke-width="1.5" marker-end="url(#mll-arrow)">
      <line x1="148" y1="85" x2="170" y2="85"></line>
      <line x1="290" y1="85" x2="312" y2="85"></line>
      <line x1="432" y1="85" x2="454" y2="85"></line>
      <line x1="574" y1="85" x2="596" y2="85"></line>
      <line x1="662" y1="110" x2="662" y2="218"></line>
      <line x1="598" y1="245" x2="576" y2="245"></line>
      <line x1="456" y1="245" x2="434" y2="245"></line>
      <line x1="314" y1="245" x2="292" y2="245"></line>
      <line x1="172" y1="245" x2="150" y2="245"></line>
    </g>
    <path d="M89,220 C89,170 231,170 231,112" fill="none" stroke="#22863a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mll-arrow-g)"></path>
    <text x="160" y="160" class="mll-loop" text-anchor="middle">hard examples</text>
    <path d="M620,110 C600,150 540,150 520,112" fill="none" stroke="#d73a49" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#mll-arrow)"></path>
    <text x="570" y="160" class="mll-back" text-anchor="middle">not good enough</text>
  </svg>
</figure>
<style>
  .mll { margin: 1.5rem 0; }
  .mll-svg { width: 100%; display: block; overflow: visible; }
  .mll-svg text { font-size: 13px; fill: #24292e; }
  .mll-zone-off { fill: #f1f8ff; stroke: #c8e1ff; }
  .mll-zone-on { fill: #f0fff4; stroke: #bef5cb; }
  .mll-zone-label { font-weight: 600; fill: #586069 !important; }
  .mll-node rect { fill: #ffffff; stroke: #24292e; stroke-width: 1.2; }
  .mll-node text { text-anchor: middle; font-weight: 600; }
  .mll-node .mll-sub { font-weight: 400; font-size: 11.5px; fill: #586069; }
  .mll-hot rect { stroke: #22863a; stroke-width: 2; }
  .mll-loop { fill: #22863a !important; font-weight: 600; }
  .mll-back { fill: #d73a49 !important; font-size: 12px !important; }
</style>
