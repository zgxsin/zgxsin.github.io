name: Publish daily robotics data infrastructure and management digest

on:
  schedule:
    - cron: "30 8 * * *"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robotics-data-infrastructure-digest
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-digest.yml
    with:
      profile: robotics-data-infrastructure
      review: true
      timeout-minutes: 15
      commit-prefix: Publish robotics data digest
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
