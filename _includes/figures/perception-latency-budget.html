<figure id="perception-latency-budget" class="plb">
  <div class="plb-legend">Illustrative budget for one camera frame at 10 Hz. Measure your own numbers on the target.</div>
  <svg class="plb-svg" viewBox="0 0 760 175" role="img" aria-label="Latency budget of one camera frame as a stacked bar. Exposure and driver 15 ms, transport 3 ms, preprocessing 3 ms, inference 14 ms, decode and NMS 2 ms, 3D lift and TF 3 ms, total 40 ms from photon to Detection3DArray, well inside the 100 ms frame period at 10 Hz. Inference is only about a third of the total.">
    <g transform="translate(20 40)">
      <rect x="0" y="0" width="150" height="44" fill="#959da5"></rect>
      <rect x="150" y="0" width="30" height="44" fill="#d1d5da"></rect>
      <rect x="180" y="0" width="30" height="44" fill="#79b8ff"></rect>
      <rect x="210" y="0" width="140" height="44" fill="#0366d6"></rect>
      <rect x="350" y="0" width="20" height="44" fill="#79b8ff"></rect>
      <rect x="370" y="0" width="30" height="44" fill="#28a745"></rect>
      <rect x="400" y="0" width="320" height="44" fill="none" stroke="#959da5" stroke-dasharray="4 3"></rect>

      <text x="75" y="27" text-anchor="middle" class="plb-in">exposure + driver 15</text>
      <text x="280" y="27" text-anchor="middle" class="plb-in">inference 14</text>
      <text x="560" y="27" text-anchor="middle" class="plb-idle">slack until the next frame</text>

      <g class="plb-lab">
        <line x1="165" y1="44" x2="165" y2="70"></line><text x="165" y="84" text-anchor="middle">transport 3</text>
        <line x1="195" y1="44" x2="195" y2="98"></line><text x="195" y="112" text-anchor="middle">preprocess 3</text>
        <line x1="360" y1="44" x2="360" y2="70"></line><text x="360" y="84" text-anchor="middle">decode + NMS 2</text>
        <line x1="385" y1="44" x2="385" y2="98"></line><text x="385" y="112" text-anchor="middle">3D lift + TF 3</text>
      </g>

      <path d="M0,-8 L0,-14 L400,-14 L400,-8" fill="none" stroke="#24292e"></path>
      <text x="200" y="-20" text-anchor="middle" font-weight="600">40 ms photon to Detection3DArray</text>
      <path d="M0,130 L0,136 L720,136 L720,130" fill="none" stroke="#24292e"></path>
      <text x="360" y="152" text-anchor="middle">100 ms frame period (10 Hz)</text>
    </g>
  </svg>
</figure>
<style>
  .plb { margin: 1.5rem 0; }
  .plb-svg { width: 100%; display: block; overflow: visible; }
  .plb-svg text { font-size: 13px; fill: #24292e; }
  .plb-svg .plb-in { fill: #fff; font-weight: 600; }
  .plb-svg .plb-idle { fill: #586069; }
  .plb-lab line { stroke: #586069; }
  .plb-lab text { font-size: 12px !important; fill: #586069 !important; }

</style>
