name: Publish weekly robotics datasets and benchmarks digest

on:
  schedule:
    - cron: "0 12 * * THU"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robotics-datasets-and-benchmarks-digest
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-digest.yml
    with:
      profile: robotics-datasets-and-benchmarks
      review: true
      timeout-minutes: 15
      commit-prefix: Publish robotics datasets and benchmarks digest
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
