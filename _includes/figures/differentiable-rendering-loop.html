<figure id="differentiable-rendering-loop" class="fig drl">
  <div class="fig-legend drl-legend">
    <span><i class="drl-swatch drl-dark"></i>forward pass: render an image</span>
    <span><i class="drl-swatch drl-orange"></i>backward pass: gradients update the scene</span>
  </div>
  <svg class="fig-svg fig-svg-wide drl-svg" viewBox="0 0 760 210" role="img" aria-label="Differentiable rendering loop. A scene representation is rendered from the camera pose of a captured view, the rendered image is compared with the captured image, and the gradient of the photometric loss flows back through the renderer to update the scene representation.">
    <defs>
      <marker id="drl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#24292e"></path>
      </marker>
      <marker id="drl-arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#e36209"></path>
      </marker>
    </defs>

    <rect x="10" y="80" width="160" height="58" rx="6" fill="#f1f8ff" stroke="#0366d6" stroke-width="1.5"></rect>
    <text x="90" y="104" text-anchor="middle" font-weight="600">Scene representation θ</text>
    <text x="90" y="124" text-anchor="middle" class="drl-muted">voxels, MLP, Gaussians</text>

    <rect x="205" y="80" width="160" height="58" rx="6" fill="#fffbdd" stroke="#b08800" stroke-width="1.5"></rect>
    <text x="285" y="104" text-anchor="middle" font-weight="600">Differentiable renderer</text>
    <text x="285" y="124" text-anchor="middle" class="drl-muted">volume rendering, splatting</text>

    <rect x="400" y="80" width="120" height="58" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1.5"></rect>
    <text x="460" y="104" text-anchor="middle" font-weight="600">Rendered image</text>
    <text x="460" y="124" text-anchor="middle" class="drl-muted">Î = R(θ, πₖ)</text>

    <rect x="555" y="80" width="195" height="58" rx="6" fill="#fff5f5" stroke="#d73a49" stroke-width="1.5"></rect>
    <text x="652" y="104" text-anchor="middle" font-weight="600">Photometric loss</text>
    <text x="652" y="124" text-anchor="middle" class="drl-muted">L = ‖Î − Iₖ‖²</text>

    <rect x="205" y="8" width="160" height="40" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1.5"></rect>
    <text x="285" y="33" text-anchor="middle">Camera pose πₖ (from SfM)</text>

    <rect x="555" y="8" width="195" height="40" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1.5"></rect>
    <text x="652" y="33" text-anchor="middle">Captured image Iₖ</text>

    <line x1="170" y1="109" x2="203" y2="109" stroke="#24292e" stroke-width="1.5" marker-end="url(#drl-arrow)"></line>
    <line x1="365" y1="109" x2="398" y2="109" stroke="#24292e" stroke-width="1.5" marker-end="url(#drl-arrow)"></line>
    <line x1="520" y1="109" x2="553" y2="109" stroke="#24292e" stroke-width="1.5" marker-end="url(#drl-arrow)"></line>
    <line x1="285" y1="48" x2="285" y2="78" stroke="#24292e" stroke-width="1.5" marker-end="url(#drl-arrow)"></line>
    <line x1="652" y1="48" x2="652" y2="78" stroke="#24292e" stroke-width="1.5" marker-end="url(#drl-arrow)"></line>

    <path d="M652,138 L652,178 L90,178 L90,141" fill="none" stroke="#e36209" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#drl-arrow-g)"></path>
    <text x="371" y="198" text-anchor="middle" class="drl-orange-text">∂L/∂θ flows back through the renderer; repeat for many views and pixels</text>
  </svg>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" | strip }}</figcaption>{% endif %}
</figure>
<style>
  .drl-svg text.drl-muted { fill: #586069; font-size: 12px; }
  .drl-svg text.drl-orange-text { fill: #e36209; }
  .drl-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .drl-dark { background: #24292e; }
  .drl-orange { background: #e36209; }
</style>
